[project]
name = "bahikhata-ai"
version = "0.1.0"
description = "Ledger AI, an intelligent bookkeeping assistant: receipt-to-ledger for Nepali small businesses (student MVP)."
requires-python = ">=3.11"
# Runtime dependencies: exactly the list approved in ARCHITECTURE.md §18.
# sqlite3 is part of the Python standard library, so it is not listed.
dependencies = [
    "streamlit",        # UI
    "pydantic>=2",      # schemas / parsing LLM output
    "pandas",           # dashboard frames, eval metrics
    "nepali-datetime",  # BS <-> AD conversion (verified in TASK-003)
    "google-genai",     # Gemini SDK (verified in TASK-002)
    "pillow",           # image checks, EXIF rotate, resize
    "sqlglot",          # SQL safety guard (AST checks)
    "rapidfuzz",        # fuzzy matching in evaluation
    "python-dotenv",    # load .env into environment variables
    "psycopg[binary]>=3.3.6", # Neon Postgres driver (Amendment A1)
    "alembic>=1.13",    # schema migrations (Amendment A2; replaces plain-SQL runner)
    "sqlalchemy>=2.0",  # Alembic's migration engine only -- app code still uses raw psycopg
    "pinecone>=10.0.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# This is an application, not a library we publish: no build step needed.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
